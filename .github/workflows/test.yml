name: test

on:
  push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "16.17.0"
      - name: Install dependencies
        run: "npm ci"
      - name: Test
        run: "npm run test"
